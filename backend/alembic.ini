[alembic]
script_location = alembic

# A URL real é montada em alembic/env.py a partir das mesmas variáveis de
# ambiente do resto da aplicação (DB_HOST/DB_NAME/DB_USER/DB_PASSWORD) — não
# fica hardcoded aqui pra não expor credencial em arquivo versionado.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
