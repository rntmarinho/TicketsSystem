[alembic]
script_location = alembic

# A URL real é montada em alembic/env.py a partir das mesmas variáveis de
# ambiente do resto da aplicação (DB_HOST/DB_NAME/DB_USER/DB_PASSWORD) — não
# fica hardcoded aqui pra não expor credencial em arquivo versionado.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
# INFO (nao WARN) -- esse fileConfig() roda no boot de toda a aplicacao
# (run_alembic_upgrade() em main.py), entao o nivel definido aqui e o que
# vale pro root logger da aplicacao inteira dali em diante, nao so pro
# Alembic. Em WARN, todo "logging.info(...)" do resto do app (ex: o daemon
# de e-mail em services/email_service.py) ficava silenciosamente descartado
# -- foi o que escondeu por dias uma falha real no processamento de e-mail
# (14/09/2026).
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
